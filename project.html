      /* Atmospheric Editorial Mist (Cardless Ambient Scrim - No borders, no boxes) */
      .editorial-mist {
        position: absolute;
        inset: -2.5rem -4rem -2rem -4rem;
        background: radial-gradient(ellipse 95% 80% at 40% 45%, rgba(255, 255, 255, 0.88) 0%, rgba(255, 255, 255, 0.55) 55%, rgba(255, 255, 255, 0) 100%);

        z-index: -1;

      }
      html.dark .editorial-mist {

      }

      /* Refined studio-nav glass uniformity to eliminate cloud glare patches */
      html:not(.dark) .studio-nav {
        background-color: rgba(255, 255, 255, 0.80) !important;
        backdrop-filter: blur(24px) saturate(140%) !important;
        -webkit-backdrop-filter: blur(24px) saturate(140%) !important;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.05) !important;

      /* ── Interactive Smooth Mobile Screen Scroller ─────────────────── */
      .phone-screen-scroll {
        scrollbar-width: thin;
        scrollbar-color: rgba(16, 185, 129, 0.45) transparent;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
      }
      .phone-screen-scroll::-webkit-scrollbar {
        width: 3.5px;
      }
      .phone-screen-scroll::-webkit-scrollbar-track {
        background: transparent;
      }
      .phone-screen-scroll::-webkit-scrollbar-thumb {
        background: rgba(16, 185, 129, 0.4);
        border-radius: 9999px;
      }
      .phone-screen-scroll::-webkit-scrollbar-thumb:hover {
        background: rgba(16, 185, 129, 0.8);
      }

      /* ── Hot Trend 1: Specular Shimmer Sweep ───────────────────────── */
      @keyframes shimmerSweep {
        0% { transform: translateX(-160%) skewX(-20deg); }
        30%, 100% { transform: translateX(260%) skewX(-20deg); }
      }
      .shimmer-badge {
        position: relative;
        overflow: hidden;
      }
      .shimmer-badge::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.40) 50%, transparent 100%);
        animation: shimmerSweep 4.8s infinite ease-in-out;
        pointer-events: none;
      }

      /* ── Hot Trend 2: Spatial Floating Pins ────────────────────────── */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatDelayed {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(7px); }
      }
      .animate-float-slow {
        animation: floatSlow 4s ease-in-out infinite;
      }
      .animate-float-delayed {
        animation: floatDelayed 4.5s ease-in-out infinite 0.7s;
      }

      /* ── Hot Trend 3: 3D Perspective & Magnetic Button ─────────────── */
      .perspective-1000 {
        perspective: 1000px;
      }
      .magnetic-btn {
        transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
        will-change: transform;
      }

      /* ── Hot Trend 4: The River of Time (Hành Trình Dòng Sông Sống Động) ── */
      @keyframes riverFlowWater {
        0% { stroke-dashoffset: 1800; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes riverFlowWaterSlow {
        0% { stroke-dashoffset: 1400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes riverWaterShimmer {
        0%, 100% {
          opacity: 0.35;
          filter: drop-shadow(0 0 5px rgba(45, 212, 191, 0.35));
        }
        50% {
          opacity: 0.95;
          filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.85));
        }
      }
      @keyframes riverRipplePulse {
        0% { transform: scale(0.85); opacity: 0.85; }
        60% { transform: scale(1.85); opacity: 0.20; }
        100% { transform: scale(2.4); opacity: 0; }
      }
      @keyframes riverLilyBob {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-5px) rotate(2deg); }
      }
      @keyframes riverDriftBubble {
        0% {
          transform: translate(0, 0) scale(0.8);
          opacity: 0;
        }
        20% {
          opacity: 0.9;
          transform: translate(25px, -6px) scale(1);
        }
        80% {
          opacity: 0.9;
          transform: translate(110px, 4px) scale(1.1);
        }
        100% {
          transform: translate(140px, -2px) scale(0.7);
          opacity: 0;
        }
      }
      @keyframes riverEnergyPulse {
        0%, 100% { opacity: 0.35; stroke-width: 2.5px; }
        50% { opacity: 1; stroke-width: 5px; filter: drop-shadow(0 0 10px #22d3ee); }
      }
      .river-stream-main {
        stroke-dasharray: 28 20;
        animation: riverFlowWater 26s linear infinite;
      }
      .river-stream-slow {
        stroke-dasharray: 18 24;
        animation: riverFlowWaterSlow 34s linear infinite;
      }
      .river-stream-fast {
        stroke-dasharray: 12 14;
        animation: riverFlowWater 14s linear infinite;
      }
      .river-stream-glow {
        stroke-dasharray: 36 44;
        animation: riverFlowWater 18s linear infinite, riverWaterShimmer 4s ease-in-out infinite;
      }
      .river-ripple-effect {
        animation: riverRipplePulse 3.4s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
      }
      .river-lily-item {
        animation: riverLilyBob 5s ease-in-out infinite;
      }
      .river-energy-lit {
        animation: riverEnergyPulse 1.8s ease-in-out infinite;
      }
      .river-bubble-1 { animation: riverDriftBubble 7s ease-in-out infinite; }
      .river-bubble-2 { animation: riverDriftBubble 8.5s ease-in-out infinite 2s; }
      .river-bubble-3 { animation: riverDriftBubble 6.2s ease-in-out infinite 3.5s; }

      /* ── Hot Trend 4: The Open Ocean Horizon (Đại dương phẳng lặng & Bến đỗ an tâm) ── */
      @keyframes oceanWaveFlow1 {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(-36px); }
      }
      @keyframes oceanWaveFlow2 {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(32px); }
      }
      @keyframes oceanWaveFlow3 {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(-24px); }
      }
      @keyframes oceanBoatSway {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(3deg); }
      }
      @keyframes oceanSparkleTwinkle {
        0%, 100% { opacity: 0.15; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.3); filter: drop-shadow(0 0 6px #2dd4bf); }
      }
      @keyframes oceanMistDrift {
        0%, 100% { transform: translateX(-20px); opacity: 0.3; }
        50% { transform: translateX(30px); opacity: 0.65; }
      }
      @keyframes oceanHorizonPulse {
        0%, 100% { opacity: 0.45; transform: scale(0.98); filter: blur(32px); }
        50% { opacity: 0.85; transform: scale(1.06); filter: blur(40px); }
      }
      @keyframes seagullGlideEast {
        0% { transform: translate(-80px, 12px) scale(0.85); opacity: 0; }
        15% { opacity: 0.8; }
        85% { opacity: 0.8; }
        100% { transform: translate(450px, -24px) scale(0.95); opacity: 0; }
      }
      @keyframes seagullGlideWest {
        0% { transform: translate(80px, 0px) scale(0.75); opacity: 0; }
        15% { opacity: 0.75; }
        85% { opacity: 0.75; }
        100% { transform: translate(-420px, -18px) scale(0.8); opacity: 0; }
      }
      .ocean-wave-layer-1 {
        animation: oceanWaveFlow1 9s ease-in-out infinite;
      }
      .ocean-wave-layer-2 {
        animation: oceanWaveFlow2 12s ease-in-out infinite;
      }
      .ocean-wave-layer-3 {
        animation: oceanWaveFlow3 16s ease-in-out infinite;
      }
      .ocean-docked-boat {
        animation: oceanBoatSway 4.4s ease-in-out infinite;
        transform-origin: center bottom;
      }
      .ocean-glimmer-1 { animation: oceanSparkleTwinkle 2.8s ease-in-out infinite; }
      .ocean-glimmer-2 { animation: oceanSparkleTwinkle 3.6s ease-in-out infinite 1.2s; }
      .ocean-glimmer-3 { animation: oceanSparkleTwinkle 4.2s ease-in-out infinite 2.1s; }
      .ocean-mist { animation: oceanMistDrift 18s ease-in-out infinite; }
      .ocean-horizon-glow { animation: oceanHorizonPulse 7s ease-in-out infinite; }
      .seagull-glide-1 { animation: seagullGlideEast 24s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
      .seagull-glide-2 { animation: seagullGlideWest 28s cubic-bezier(0.4, 0, 0.6, 1) infinite 6s; }
      .seagull-glide-3 { animation: seagullGlideEast 20s cubic-bezier(0.4, 0, 0.6, 1) infinite 13s; }
    </style>

        // ── Scroll-Triggered Reveal with IntersectionObserver ──────────────────
        function initRevealObserver() {
          const ALL_REVEAL = '[class*="reveal"]';
          const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add('animate-in');
                observer.unobserve(entry.target);
              }
            });
          }, {
            root: null,
            rootMargin: '0px 0px -60px 0px', // trigger 60px before bottom of viewport
            threshold: 0.08
          });

          document.querySelectorAll(ALL_REVEAL).forEach((el, i) => {
            // Add incremental delay based on DOM order for natural cascade
            el.style.transitionDelay = `${Math.min(i * 0.04, 0.32)}s`;
            observer.observe(el);
          });
        }

        // First batch (hero) immediately, rest on scroll
        requestAnimationFrame(() => {
          const firstCard = document.querySelector('.reveal, .reveal-left, .reveal-scale');
          if (firstCard) {
            firstCard.classList.add('animate-in');
          }
          setTimeout(initRevealObserver, 80);
        });


        // ── Drag-to-Scroll & Mouse-Drag Simulator for Phone Screens ────────────
        function initDragToScroll() {
          const containers = document.querySelectorAll('.phone-screen-scroll');
          containers.forEach((container) => {
            const parent = container.closest('.phone-mockup-frame');
            const hint = parent ? parent.querySelector('.phone-scroll-hint') : null;

            const hideHint = () => {
              if (hint && !hint.classList.contains('opacity-0')) {
                hint.classList.add('opacity-0', 'pointer-events-none');
              }
            };

            const checkScrollable = () => {
              const hasOverflow = container.scrollHeight > container.clientHeight + 4;
              if (hasOverflow) {
                if (hint) {
                  hint.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
                  hint.classList.add('opacity-90');
                }
                container.classList.add('cursor-grab');
                container.classList.remove('cursor-default');
              } else {
                if (hint) {
                  hint.classList.add('hidden', 'opacity-0', 'pointer-events-none');
                }
                container.classList.remove('cursor-grab', 'cursor-grabbing');
                container.classList.add('cursor-default');
              }
            };

            const img = container.querySelector('img');
            if (img) {
              if (img.complete) {
                checkScrollable();
              } else {
                img.addEventListener('load', checkScrollable);
              }
            }

            if (container.dataset.scrollBound === 'true') return;
            container.dataset.scrollBound = 'true';

            // 1. Mouse Wheel Scroll (Smooth & Intuitive inside phone screen)
            container.addEventListener('wheel', (e) => {
              if (container.scrollHeight > container.clientHeight + 4) {
                const isAtTop = container.scrollTop <= 0 && e.deltaY < 0;
                const isAtBottom = container.scrollTop + container.clientHeight >= container.scrollHeight - 2 && e.deltaY > 0;
                if (!isAtTop && !isAtBottom) {
                  e.preventDefault();
                  e.stopPropagation();
                  container.scrollTop += e.deltaY;
                  hideHint();
                }
              }
            }, { passive: false });

            // 2. Click & Drag-to-Scroll Simulation (Viewport coordinates)
            let isDown = false;
            let startY = 0;
            let startScrollTop = 0;

            container.addEventListener('mousedown', (e) => {
              if (container.scrollHeight <= container.clientHeight + 4) return;
              isDown = true;
              startY = e.clientY;
              startScrollTop = container.scrollTop;
              container.classList.add('cursor-grabbing');
              container.classList.remove('cursor-grab');
              window.getSelection()?.removeAllRanges();
            });

            window.addEventListener('mousemove', (e) => {
              if (!isDown) return;
              e.preventDefault();
              const deltaY = e.clientY - startY;
              container.scrollTop = startScrollTop - deltaY;
              hideHint();
            });

            const stopDrag = () => {
              if (!isDown) return;
              isDown = false;
              container.classList.remove('cursor-grabbing');
              if (container.scrollHeight > container.clientHeight + 4) {
                container.classList.add('cursor-grab');
              }
            };

            window.addEventListener('mouseup', stopDrag);
            container.addEventListener('scroll', hideHint, { passive: true });
          });
        }

        // ── Hot Trend 2: Animated Number Counter on Viewport Entry ───────────
        function initAnimatedCounters() {
          const counterEls = document.querySelectorAll('.counter-value');
          if (!counterEls.length) return;

          const observer = new IntersectionObserver((entries, obs) => {
            entries.forEach(entry => {
              if (entry.isIntersecting) {
                const el = entry.target;
                const targetStr = el.dataset.counterTarget || el.textContent.trim();
                const match = targetStr.match(/^([^\d]*)([\d]+)([^\d]*)$/);
                if (match) {
                  const prefix = match[1] || '';
                  const targetNum = parseInt(match[2], 10);
                  const suffix = match[3] || '';
                  const duration = 1200;
                  const startTime = performance.now();

                  const updateCounter = (currentTime) => {
                    const elapsed = currentTime - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const easeOut = 1 - Math.pow(1 - progress, 3);
                    const currentNum = Math.floor(easeOut * targetNum);
                    el.textContent = `${prefix}${currentNum}${suffix}`;

                    if (progress < 1) {
                      requestAnimationFrame(updateCounter);
                    } else {
                      el.textContent = targetStr;
                    }
                  };
                  requestAnimationFrame(updateCounter);
                }
                obs.unobserve(el);
              }
            });
          }, { threshold: 0.2 });

          counterEls.forEach(el => observer.observe(el));
        }

              const x = e.clientX - rect.left - rect.width / 2;

              btn.style.transform = `translate(${x * 0.18}px, ${y * 0.18}px) scale(1.02)`;
            }, { passive: true });

            btn.addEventListener('mouseleave', () => {
              btn.style.transform = '';
            }, { passive: true });
          });
        }

        function initSmartNavbar() {

            if (currentScrollY > lastScrollY) {
              // Scrolling down -> hide navbar smoothly
              navbar.classList.remove('translate-y-0', 'opacity-100', 'pointer-events-auto');
              navbar.classList.add('-translate-y-full', 'opacity-0', 'pointer-events-none');

              title: "Reserve a Charging Slot",
              desc: "Allows drivers to hold an available charging slot for 15–20 minutes before arriving, avoiding long queues.",
              stoneIcon: "clock",
              fact: "15-Min Slot Hold",
              techDesc: "Reserves a selected charger temporarily with a countdown timer, helping drivers secure their spot during busy peak hours.",
              metric: "Hold Countdown • No Waiting in Line",
              actionAdvice: "Include a visible countdown timer and simple cancellation button if travel plans change."
            },
            {
              num: "05",
              stage: "START CHARGING",
              title: "Scan QR & Plug In Cable",
              desc: "Scan the QR code on the charger and plug in the cable with clear on-screen safety guidance.",
              stoneIcon: "qr-code",
              fact: "Quick QR Scanner",
              techDesc: "A quick camera scan identifies the specific charger post, confirms the connection, and guides the user step-by-step through plugging in safely.",
              metric: "Instant Scan • Clear Step Guide",
              actionAdvice: "Provide friendly visual illustrations to guide first-time EV drivers on how to plug in securely."
            },
            {
              num: "06",
              stage: "CHARGING PROGRESS",
              title: "Live Charging Monitor",
              desc: "Tracks battery percentage, charging speed (kW), energy added, and running cost, with an easy emergency stop button.",
              stoneIcon: "zap",
              fact: "Live Progress Tracking",
              techDesc: "Shows live battery percentage, charging speed, elapsed time, and accumulated cost in real-time, giving drivers peace of mind while away from the car.",
              metric: "Real-Time Progress • Stop Button",
              actionAdvice: "Send push notifications when battery reaches 80% so drivers can return to unplug promptly."
            },
            {
              num: "07",
              stage: "PAYMENT & RECEIPT",
              title: "Automatic Payment & Receipt",
              desc: "Automatically deducts payment from the linked wallet once charging stops, and provides a clear itemized receipt.",
              stoneIcon: "check-circle-2",
              fact: "Auto Wallet Payment",
              techDesc: "Calculates the final cost upon unplugging, processes payment via linked wallet or card, and saves an itemized electronic invoice.",
              metric: "Clear Invoice • Auto Deduction",
              actionAdvice: "Display a clean summary breakdown showing kWh used, unit price, and charging duration for full transparency."
            }
          ];

          // 2. Native Web Audio API Pentatonic Chime Synthesizer
          const PENTATONIC_FREQS = [329.63, 392.00, 440.00, 523.25, 659.25, 783.99, 880.00]; // E4, G4, A4, C5, E5, G5, A5
          let audioCtx = null;
          let isRiverAudioMuted = false;

          function getAudioContext() {
            if (!audioCtx) {
              const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
              if (AudioCtxClass) audioCtx = new AudioCtxClass();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
              audioCtx.resume();
            }
            return audioCtx;
          }

          function playRiverChime(freq, duration = 1.4, volume = 0.14) {
            if (isRiverAudioMuted) return;
            try {
              const ctx = getAudioContext();
              if (!ctx) return;
              const now = ctx.currentTime;
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();

              // High crystal overtone
              const osc2 = ctx.createOscillator();
              const gain2 = ctx.createGain();

              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, now);

              osc2.type = 'triangle';
              osc2.frequency.setValueAtTime(freq * 2.01, now);

              gain.gain.setValueAtTime(0.0001, now);
              gain.gain.linearRampToValueAtTime(volume, now + 0.02);
              gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

              gain2.gain.setValueAtTime(0.0001, now);
              gain2.gain.linearRampToValueAtTime(volume * 0.22, now + 0.015);
              gain2.gain.exponentialRampToValueAtTime(0.0001, now + duration * 0.65);

              osc.connect(gain);
              osc2.connect(gain2);
              gain.connect(ctx.destination);
              gain2.connect(ctx.destination);

              osc.start(now);
              osc2.start(now);
              osc.stop(now + duration);
              osc2.stop(now + duration * 0.65);
            } catch (e) {
              // Audio context not ready
            }
          }

          window.toggleRiverAudio = function() {
            isRiverAudioMuted = !isRiverAudioMuted;
            const globalBtn = document.getElementById('global-audio-toggle');
            const globalIcon = document.getElementById('global-audio-icon');
            const globalDot = document.getElementById('global-audio-dot');
            const globalPulse = document.getElementById('global-audio-pulse');

            if (globalIcon) {
              globalIcon.setAttribute('data-lucide', isRiverAudioMuted ? 'volume-x' : 'volume-2');
              if (isRiverAudioMuted) {
                globalIcon.classList.remove('text-teal-500');
                globalIcon.classList.add('text-zinc-400', 'opacity-60');
              } else {
                globalIcon.classList.remove('text-zinc-400', 'opacity-60');
                globalIcon.classList.add('text-teal-500');
              }
            }
            if (globalDot) {
              globalDot.style.display = isRiverAudioMuted ? 'none' : 'block';
            }
            if (globalPulse) {
              globalPulse.style.display = isRiverAudioMuted ? 'none' : 'block';
            }
            if (globalBtn) {
              globalBtn.setAttribute('title', isRiverAudioMuted ? 'Sound: Muted (Click to enable)' : 'Sound: Active (Click to mute)');
            }
            if (window.lucide) lucide.createIcons();

            if (!isRiverAudioMuted) {
              playRiverChime(PENTATONIC_FREQS[2], 1.2, 0.18);
            }
          };

          window.playRiverPentatonicChime = function() {
            if (isRiverAudioMuted) return;
            const scale = [392.00, 440.00, 523.25, 659.25, 783.99, 880.00];
            scale.forEach((freq, idx) => {
              setTimeout(() => {
                playRiverChime(freq, 1.8, 0.16);
              }, idx * 170);
            });
          };

          // 2b. Autoplay Chime on Scroll into User Experience section (No clicking needed)
          let hasAutoTriggeredChime = false;
          function checkFlowScrollTrigger() {
            if (hasAutoTriggeredChime || isRiverAudioMuted) return;
            const flowEl = document.getElementById('flow');
            if (!flowEl) return;
            const rect = flowEl.getBoundingClientRect();
            if (rect.top <= window.innerHeight * 0.75 && rect.bottom >= 100) {
              hasAutoTriggeredChime = true;
              const ctx = getAudioContext();
              if (ctx && ctx.state === 'suspended') {
                ctx.resume().then(() => {
                  window.playRiverPentatonicChime();
                }).catch(() => {});
              } else {
                window.playRiverPentatonicChime();
              }
            }
          }

          const unlockAndCheckAudio = () => {
            getAudioContext();
            checkFlowScrollTrigger();
          };
          window.addEventListener('scroll', checkFlowScrollTrigger, { passive: true });
          window.addEventListener('pointerdown', unlockAndCheckAudio, { once: true, passive: true });
          window.addEventListener('keydown', unlockAndCheckAudio, { once: true, passive: true });
          window.addEventListener('wheel', unlockAndCheckAudio, { once: true, passive: true });
          setTimeout(checkFlowScrollTrigger, 400);

          // 3. Technical Inspection Modal Handling
          window.openRiverTechModal = function(idx) {
            const ch = riverChaptersData[idx];
            if (!ch) return;
            const modal = document.getElementById('river-tech-modal');
            const content = document.getElementById('river-modal-content');
            if (!modal || !content) return;

            const noteFreq = PENTATONIC_FREQS[idx % PENTATONIC_FREQS.length];
            playRiverChime(noteFreq, 1.6, 0.2);

            content.innerHTML = `
              <div class="flex items-center gap-2 mb-2 season-highlight font-mono text-xs font-bold uppercase tracking-wider">
                <i data-lucide="${ch.stoneIcon}" class="w-4 h-4"></i>
                <span>STAGE ${ch.num} • ${ch.stage}</span>
              </div>
              <h3 class="text-2xl font-serif font-bold text-zinc-900 dark:text-white mb-2">
                ${ch.title}
              </h3>
              <p class="text-xs sm:text-sm font-sans text-teal-950 dark:text-teal-100 mb-4 bg-teal-500/10 dark:bg-teal-500/15 p-3.5 rounded-xl border border-teal-500/20 leading-relaxed">
                ${ch.desc}
              </p>

              <div class="space-y-3 mb-6 text-xs text-zinc-700 dark:text-zinc-300 font-sans leading-relaxed">
                <div class="p-3.5 rounded-xl bg-zinc-100 dark:bg-zinc-900/80 border border-zinc-200/60 dark:border-white/10">
                  <span class="font-mono font-bold text-[11px] text-teal-700 dark:text-teal-400 uppercase block mb-1">
                    DESIGN LOGIC & FLOW DETAIL
                  </span>
                  <p>${ch.techDesc}</p>
                </div>

                <div class="flex items-center justify-between p-3 rounded-xl bg-emerald-500/10 dark:bg-emerald-500/15 border border-emerald-500/25">
                  <span class="font-mono text-[11px] text-emerald-800 dark:text-emerald-300 font-bold">KEY UX GOALS</span>
                  <span class="font-mono text-xs font-extrabold text-emerald-700 dark:text-emerald-400">${ch.metric}</span>
                </div>

                <div class="text-[11px] font-mono text-zinc-500 dark:text-zinc-400">
                  💡 <strong class="text-zinc-700 dark:text-zinc-300">Design Note:</strong> ${ch.actionAdvice}
                </div>
              </div>

              <div class="flex items-center justify-end">
                <button type="button" onclick="window.closeRiverTechModal()" class="px-5 py-2 rounded-full bg-teal-600 hover:bg-teal-700 text-white font-mono text-xs font-bold transition-all shadow-md cursor-pointer">
                  Close
                </button>
              </div>
            `;

            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.classList.add('opacity-100', 'pointer-events-auto');
            const innerCard = modal.querySelector('div.transform');
            if (innerCard) {
              innerCard.classList.remove('scale-95');
              innerCard.classList.add('scale-100');
            }
            if (window.lucide) lucide.createIcons();
          };

          window.closeRiverTechModal = function() {
            const modal = document.getElementById('river-tech-modal');
            if (!modal) return;
            const innerCard = modal.querySelector('div.transform');
            if (innerCard) {
              innerCard.classList.remove('scale-100');
              innerCard.classList.add('scale-95');
            }
            modal.classList.remove('opacity-100', 'pointer-events-auto');
            modal.classList.add('opacity-0', 'pointer-events-none');
          };

          const modalEl = document.getElementById('river-tech-modal');
          if (modalEl) {
            modalEl.onclick = (e) => {
              if (e.target === modalEl) window.closeRiverTechModal();
            };
          }
          window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') window.closeRiverTechModal();
          });

          // Scrubber cuộn nhanh từ biểu đồ cảm xúc
          window.scrollToRiverChapter = function(idx) {
            const target = document.getElementById(`river-chapter-${idx}`);
            if (target) {
              target.scrollIntoView({ behavior: 'smooth', block: 'center' });
              const noteFreq = PENTATONIC_FREQS[idx % PENTATONIC_FREQS.length];
              playRiverChime(noteFreq, 1.6, 0.2);
              if (canvas && track) {
                const rect = target.getBoundingClientRect();
                const trackRect = track.getBoundingClientRect();
                const x = trackRect.width / 2;
                const y = (rect.top - trackRect.top) + rect.height / 2;
                if (typeof spawnWaterRipple === 'function') {
                  spawnWaterRipple(x, y, 3);
                }
              }
            }
          };

          // 4. Origami Paper Boat Gliding & Tangent Heading on Scroll
          function updateBoatOnScroll() {
            if (!track || !boat || !riverPath) return;
            const trackRect = track.getBoundingClientRect();
            const windowH = window.innerHeight || 800;

            const startOffset = windowH * 0.45;
            const scrollDistance = trackRect.height;
            const currentScroll = windowH - trackRect.top - startOffset;
            let progress = currentScroll / scrollDistance;
            progress = Math.max(0.01, Math.min(0.99, progress));

            try {
              const totalLen = riverPath.getTotalLength();
              const targetLen = progress * totalLen;
              const pt = riverPath.getPointAtLength(targetLen);
              const ptNext = riverPath.getPointAtLength(Math.min(totalLen, targetLen + 4));

              const svgEl = riverPath.ownerSVGElement;
              if (svgEl) {
                const svgRect = svgEl.getBoundingClientRect();
                const vbHeight = svgEl.viewBox?.baseVal?.height || 1500;
                const scaleX = svgRect.width / 400;
                const scaleY = svgRect.height / vbHeight;

                const boatX = (svgRect.left - trackRect.left) + pt.x * scaleX;
                const boatY = (svgRect.top - trackRect.top) + pt.y * scaleY;
                const angleRad = Math.atan2(ptNext.y - pt.y, ptNext.x - pt.x);
                const angleDeg = angleRad * (180 / Math.PI);

                boat.style.left = `${boatX}px`;
                boat.style.top = `${boatY}px`;
                boat.style.transform = `translate(-50%, -50%) rotate(${angleDeg - 90}deg)`;
              }
            } catch (err) {
              // Path not yet measured
            }
          }

          window.addEventListener('scroll', updateBoatOnScroll, { passive: true });
          window.addEventListener('resize', updateBoatOnScroll);
          setTimeout(updateBoatOnScroll, 150);

          // 5. Water Ripple Canvas Simulation Layer
          if (canvas) {
            const ctx = canvas.getContext('2d');
            let ripples = [];
            let lastMove = 0;

            function resizeCanvas() {
              canvas.width = track.offsetWidth || 1000;
              canvas.height = track.offsetHeight || 1800;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            function spawnWaterRipple(x, y, count = 2) {
              for (let i = 0; i < count; i++) {
                setTimeout(() => {
                  ripples.push({
                    x: x,
                    y: y,
                    r: 3,
                    maxR: 52 + i * 22,
                    opacity: 0.85,
                    speed: 1.25,
                    color: 'rgba(45, 212, 191, 0.85)'
                  });
                }, i * 140);
              }
            }

            track.addEventListener('pointerdown', (e) => {
              const rect = track.getBoundingClientRect();
              const x = e.clientX - rect.left;
              const y = e.clientY - rect.top;
              spawnWaterRipple(x, y, 3);
              const randFreq = PENTATONIC_FREQS[Math.floor(Math.random() * PENTATONIC_FREQS.length)];
              playRiverChime(randFreq, 1.2, 0.12);
            });

            track.addEventListener('mousemove', (e) => {
              const now = performance.now();
              if (now - lastMove < 50) return;
              lastMove = now;
              const rect = track.getBoundingClientRect();
              const x = e.clientX - rect.left;
              const y = e.clientY - rect.top;
              ripples.push({
                x: x,
                y: y,
                r: 2,
                maxR: 36,
                opacity: 0.7,
                speed: 1.1,
                color: 'rgba(56, 189, 248, 0.75)'
              });
            }, { passive: true });

            function renderRipples() {
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              for (let i = ripples.length - 1; i >= 0; i--) {
                const rp = ripples[i];
                rp.r += rp.speed;
                rp.opacity -= (rp.speed / rp.maxR) * 0.85;

                if (rp.opacity <= 0.01 || rp.r >= rp.maxR) {
                  ripples.splice(i, 1);
                  continue;
                }

                ctx.save();
                ctx.beginPath();
                ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
                ctx.strokeStyle = rp.color.replace(/[\d\.]+\)$/, `${Math.max(0, rp.opacity)})`);
                ctx.lineWidth = Math.max(0.6, 2.0 * (1 - rp.r / rp.maxR));
                ctx.stroke();

                if (rp.r > 12) {
                  ctx.beginPath();
                  ctx.arc(rp.x, rp.y, rp.r * 0.65, 0, Math.PI * 2);
                  ctx.strokeStyle = rp.color.replace(/[\d\.]+\)$/, `${Math.max(0, rp.opacity * 0.4)})`);
                  ctx.lineWidth = Math.max(0.4, 1.2 * (1 - rp.r / rp.maxR));
                  ctx.stroke();
                }
                ctx.restore();
              }
              requestAnimationFrame(renderRipples);
            }
            renderRipples();
          }
        }

        initDragToScroll();
        initGalleryTabs();
        initQuickNavSpy();
        initHero3DTilt();
        initAnimatedCounters();
        initMagneticButtons();
        initComparisonSlider();
        initSmartNavbar();
        initVerticalRiverJourney();

        if (window.lucide) {
          lucide.createIcons();
        }
      }

      // Lightbox Functions
      window.openLightbox = function(src, caption) {
        const modal = document.getElementById('lightbox-modal');
        const img = document.getElementById('lightbox-img');
        const cap = document.getElementById('lightbox-caption');
        if (modal && img) {
          img.src = src;
          if (cap) cap.textContent = caption || '';
          modal.classList.remove('hidden');
          requestAnimationFrame(() => {
            modal.classList.remove('opacity-0');
          });
          if (window.lucide) lucide.createIcons();
        }
      };

      window.closeLightbox = function() {
        const modal = document.getElementById('lightbox-modal');
        if (modal) {
          modal.classList.add('opacity-0');
          setTimeout(() => {
            modal.classList.add('hidden');
          }, 200);
        }
      };

      // Keyboard Accessibility: Escape key closes Lightbox
      window.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' || e.key === 'Esc') {
          closeLightbox();
        }
      });

      document.querySelectorAll('.current-year').forEach(el => {
        el.textContent = new Date().getFullYear();
      });

      loadProject();
    </script>

    <!-- Fullscreen Lightbox Modal -->
    <div id="lightbox-modal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden flex items-center justify-center p-4 transition-all duration-300 opacity-0" onclick="if(event.target === this) closeLightbox()">
      <button id="lightbox-close" type="button" onclick="closeLightbox()" class="absolute top-6 right-6 w-11 h-11 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition-all">
        <i data-lucide="x" class="w-6 h-6"></i>
      </button>
      <div class="max-w-4xl max-h-[92vh] flex flex-col items-center">
        <img id="lightbox-img" src="" alt="Zoomed screen preview" class="max-h-[82vh] w-auto object-contain rounded-2xl shadow-2xl" />
        <p id="lightbox-caption" class="mt-3 text-sm font-medium text-white/90 text-center font-display"></p>
      </div>
    </div>
  <script>
    (function(){
      const blocked = (e) => { e.preventDefault(); return false; };
      document.addEventListener('contextmenu', blocked);
      document.addEventListener('dragstart', blocked);
      document.addEventListener('selectstart', e => { if(e.target.tagName==='IMG') blocked(e); });
      document.addEventListener('keydown', e => {
        if (e.key === 'F12' ||
            (e.ctrlKey && e.shiftKey && ['I','J','C','E'].includes(e.key.toUpperCase())) ||
            (e.ctrlKey && ['U','S','P'].includes(e.key.toUpperCase()))) {
          blocked(e);
        }
      });
      const isAllowed = src => {
        if(!src) return true;
        try { const u = new URL(src, location.href); return u.origin === location.origin || src.includes('lucide') || src.includes('cdn.jsdelivr.net'); }
        catch { return true; }
      };
      new MutationObserver(muts => {
        for (const m of muts) for (const n of m.addedNodes) {
          if (n.nodeName === 'SCRIPT' && !isAllowed(n.src)) n.remove();
        }
      }).observe(document.documentElement, { childList: true, subtree: true });
    })();
  </script>
